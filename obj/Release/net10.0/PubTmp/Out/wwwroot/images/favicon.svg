<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background with rounded corners -->
  <rect width="64" height="64" rx="10" fill="#111111"/>

  <!-- Film strip left bar -->
  <rect x="6" y="10" width="8" height="44" rx="2" fill="#21D192"/>
  <!-- Film holes left -->
  <rect x="7.5" y="14" width="5" height="5" rx="1" fill="#111111"/>
  <rect x="7.5" y="23" width="5" height="5" rx="1" fill="#111111"/>
  <rect x="7.5" y="32" width="5" height="5" rx="1" fill="#111111"/>
  <rect x="7.5" y="41" width="5" height="5" rx="1" fill="#111111"/>

  <!-- Film strip right bar -->
  <rect x="50" y="10" width="8" height="44" rx="2" fill="#21D192"/>
  <!-- Film holes right -->
  <rect x="51.5" y="14" width="5" height="5" rx="1" fill="#111111"/>
  <rect x="51.5" y="23" width="5" height="5" rx="1" fill="#111111"/>
  <rect x="51.5" y="32" width="5" height="5" rx="1" fill="#111111"/>
  <rect x="51.5" y="41" width="5" height="5" rx="1" fill="#111111"/>

  <!-- Play button triangle (centered) -->
  <polygon points="24,18 24,46 46,32" fill="#21D192"/>
</svg>
